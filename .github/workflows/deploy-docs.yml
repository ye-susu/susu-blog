name: Deploy GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: susu-blog-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 获取失败就停止，防止把既有历史当成空记录覆盖。
      - name: Read previous deployment
        run: git fetch --no-tags --depth=1 origin blog-pages

      - name: Build
        run: npm run docs:build
        env:
          UPDATES_HISTORY_REF: FETCH_HEAD
          UPDATES_SOURCE_SHA: ${{ github.sha }}

      - name: Deploy
        uses: crazy-max/ghaction-github-pages@v2
        env:
          GITHUB_TOKEN: ${{ secrets.BLOG_TOKEN }}
        with:
          target_branch: blog-pages
          build_dir: docs/.vuepress/dist
          fqdn: yesusu.top
